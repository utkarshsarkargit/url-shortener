<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Shortr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17173a;
    --panel: #1f1f4a;
    --border: rgba(255,255,255,0.08);
    --accent: #ffb84d;
    --text: #f0eefa;
    --muted: #9c97c4;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    display: flex;
    justify-content: center;
    padding: 80px 20px;
    margin: 0;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 36px;
    width: 100%;
    max-width: 460px;
  }
  h1 { font-size: 22px; font-weight: 800; margin: 0 0 6px; }
  p.sub { color: var(--muted); margin: 0 0 28px; font-size: 14px; }
  .input-row { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1;
    min-width: 0;
    padding: 14px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #14142f;
    color: var(--text);
    font-family: 'Manrope', sans-serif;
    font-size: 15px;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); }
  .icon-btn {
    flex-shrink: 0;
    width: 48px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #14142f;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .icon-btn:hover { color: var(--accent); border-color: var(--accent); }
  button {
    width: 100%;
    margin-top: 12px;
    padding: 14px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #17173a;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  #result {
    display: none;
    margin-top: 28px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    animation: reveal 0.35s ease;
  }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .short-link {
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    color: var(--accent);
    text-decoration: none;
    word-break: break-all;
  }
  .row { display: flex; gap: 10px; align-items: center; margin-top: 10px; }
  .row button {
    width: auto; margin-top: 0; padding: 8px 14px; font-size: 13px;
    background: transparent; border: 1px solid var(--border); color: var(--text); font-weight: 600;
  }
  #qrImg { margin-top: 18px; border-radius: 8px; display: block; width: 120px; background: white; padding: 8px; }
  .stat { margin-top: 16px; font-size: 14px; color: var(--muted); }
  .stat span { color: var(--text); font-weight: 700; }
</style>
</head>
<body>
  <div class="panel">
    <h1>Make it short.</h1>
    <p class="sub">Paste a link, get something small enough to actually say out loud.</p>

    <div class="input-row">
      <input type="text" id="urlInput" placeholder="https://example.com/a-very-long-url">
      <button class="icon-btn" type="button" onclick="pasteUrl()" title="Paste from clipboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="8" y="2" width="8" height="4" rx="1"></rect>
          <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
        </svg>
      </button>
    </div>
    <button id="shortenBtn" type="button" onclick="shorten()">Shorten it</button>

    <div id="result">
      <a class="short-link" id="shortLink" href="#" target="_blank"></a>
      <div class="row">
        <button type="button" onclick="copyLink()">Copy</button>
        <button type="button" onclick="refreshStats()">Refresh clicks</button>
      </div>
      <img id="qrImg" src="">
      <div class="stat"><span id="clickCount">0</span> clicks so far</div>
    </div>
  </div>

<script>
const urlInput = document.getElementById('urlInput');
const shortenBtn = document.getElementById('shortenBtn');
let currentCode = null;

async function pasteUrl() {
  try {
    const text = await navigator.clipboard.readText();
    urlInput.value = text;
    shortenBtn.disabled = false;
    urlInput.focus();
  } catch (e) {
    alert('Could not read clipboard — try pasting manually with Ctrl+V.');
  }
}

urlInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    shorten();
  }
});

urlInput.addEventListener('input', () => {
  shortenBtn.disabled = false;
});

async function shorten() {
  if (shortenBtn.disabled) return;
  const url = urlInput.value;
  if (!url) {
    alert('Paste a URL first.');
    return;
  }
  try {
    const res = await fetch('/shorten', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert('Something went wrong: ' + (err.detail || res.status));
      return;
    }
    const data = await res.json();
    currentCode = data.short_code;
    const link = document.getElementById('shortLink');
    link.href = data.short_url;
    link.textContent = data.short_url;
    document.getElementById('qrImg').src = `/qr/${data.short_code}`;
    document.getElementById('result').style.display = 'block';
    shortenBtn.disabled = true;
    refreshStats();
  } catch (e) {
    alert('Network error: could not reach the server.');
  }
}

async function refreshStats() {
  if (!currentCode) return;
  const res = await fetch(`/stats/${currentCode}`);
  const data = await res.json();
  document.getElementById('clickCount').textContent = data.click_count;
}

function copyLink() {
  navigator.clipboard.writeText(document.getElementById('shortLink').href);
}
</script>
</body>
</html>
