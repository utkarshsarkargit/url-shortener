<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>URL Shortener</title>
<style>
  body { font-family: sans-serif; max-width: 500px; margin: 60px auto; padding: 0 20px; }
  input, button { padding: 10px; font-size: 16px; width: 100%; margin-top: 10px; box-sizing: border-box; }
  button { cursor: pointer; }
  #result { margin-top: 20px; padding: 10px; background: #f0f0f0; border-radius: 6px; word-break: break-all; }
</style>
</head>
<body>
  <h1>URL Shortener</h1>
  <input type="text" id="urlInput" placeholder="Paste URL here">
  <button onclick="shorten()">Shorten</button>
  <div id="result"></div>

<script>
async function shorten() {
  const url = document.getElementById('urlInput').value;
  const res = await fetch('/shorten', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url })
  });
  const data = await res.json();
  document.getElementById('result').innerHTML =
    `<a href="${data.short_url}" target="_blank">${data.short_url}</a>`;
}
</script>
</body>
</html>
